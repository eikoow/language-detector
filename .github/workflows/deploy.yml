name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell
    steps:
      - name: Start zero-downtime monitor
        run: |
          $ErrorActionPreference = 'Stop'
          $monitorLog = Join-Path $env:RUNNER_TEMP 'language-detector-monitor.csv'
          $stopFile = Join-Path $env:RUNNER_TEMP 'language-detector-monitor.stop'
          $pidFile = Join-Path $env:RUNNER_TEMP 'language-detector-monitor.pid'
          $deploymentStart = Join-Path $env:RUNNER_TEMP 'language-detector-deployment.start'
          $deploymentEnd = Join-Path $env:RUNNER_TEMP 'language-detector-deployment.end'
          Remove-Item -LiteralPath $monitorLog,$stopFile,$pidFile,$deploymentStart,$deploymentEnd -Force -ErrorAction SilentlyContinue
          $monitorScriptPath = Join-Path $env:RUNNER_TEMP 'language-detector-monitor.ps1'
          $bootstrapPath = Join-Path $env:RUNNER_TEMP 'language-detector-monitor-bootstrap.ps1'
          $monitorScript = @'
          param([string]$LogPath, [string]$StopPath, [string]$Text)
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $writer = New-Object System.IO.StreamWriter($LogPath, $false, $utf8)
          function Csv([object]$Value) { return ('"' + ([string]$Value).Replace('"','""') + '"') }
          $writer.WriteLine('request_number,start_ms,end_ms,response_ms,http_status,valid,model_version,error')
          $afterUntil = $null
          $requestNumber = 0
          try {
              while ($true) {
                  $requestNumber++
                  $startedMs = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
                  $status = 0
                  $valid = $false
                  $version = 'unknown'
                  $errorText = ''
                  try {
                      $json = @{ text = $Text } | ConvertTo-Json -Compress
                      $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
                      $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8001/detect' -Method Post -ContentType 'application/json; charset=utf-8' -Body $bytes -TimeoutSec 10
                      $status = [int]$response.StatusCode
                      $data = $response.Content | ConvertFrom-Json
                      $valid = ($status -eq 200 -and $data.language -eq 'Korean' -and $data.is_prediction -eq $true)
                      try {
                          $info = Invoke-RestMethod -Uri 'http://127.0.0.1:8001/model-info' -TimeoutSec 10
                          $version = [string]$info.model_version
                      } catch { $version = 'unknown' }
                  } catch {
                      $errorText = $_.Exception.Message.Replace("`r",' ').Replace("`n",' ')
                      if ($_.Exception.Response) {
                          try { $status = [int]$_.Exception.Response.StatusCode } catch { $status = 0 }
                      }
                  }
                  $endedMs = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
                  $elapsed = $endedMs - $startedMs
                  $fields = @((Csv $requestNumber), (Csv $startedMs), (Csv $endedMs), (Csv $elapsed), (Csv $status), (Csv $valid), (Csv $version), (Csv $errorText))
                  $writer.WriteLine(($fields -join ','))
                  $writer.Flush()
                  if (Test-Path -LiteralPath $StopPath) {
                      if (-not $afterUntil) { $afterUntil = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() + 30000 }
                      if ([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() -ge $afterUntil) { break }
                  }
                  Start-Sleep -Seconds 1
              }
          } finally {
              $writer.Dispose()
          }
          '@
          $bootstrap = @'
          param([string]$MonitorScript, [string]$LogPath, [string]$StopPath, [string]$Text)
          $job = Start-Job -FilePath $MonitorScript -ArgumentList $LogPath,$StopPath,$Text
          Wait-Job -Id $job.Id | Out-Null
          Receive-Job -Id $job.Id | Out-Null
          Remove-Job -Id $job.Id -Force
          '@
          Set-Content -LiteralPath $monitorScriptPath -Value $monitorScript -Encoding ASCII
          Set-Content -LiteralPath $bootstrapPath -Value $bootstrap -Encoding ASCII
          $koreanText = [regex]::Unescape('\uC548\uB155\uD558\uC138\uC694 \uBC18\uAC11\uC2B5\uB2C8\uB2E4')
          $monitorProcess = Start-Process -FilePath 'powershell.exe' -WindowStyle Hidden -PassThru -ArgumentList @('-NoLogo','-NoProfile','-ExecutionPolicy','Bypass','-File',$bootstrapPath,'-MonitorScript',$monitorScriptPath,'-LogPath',$monitorLog,'-StopPath',$stopFile,'-Text',$koreanText)
          Set-Content -LiteralPath $pidFile -Value $monitorProcess.Id -Encoding ASCII
          Start-Sleep -Seconds 2
          Set-Content -LiteralPath $deploymentStart -Value ([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) -Encoding ASCII

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and deploy image (zero-downtime)
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/language-detector:latest
        run: |
          $ErrorActionPreference = 'Stop'
          $network = 'language-detector-net'
          $proxy = 'language-detector-proxy'
          $current = 'language-detector-app'
          $new = 'language-detector-app-new'
          $newPort = 18001
          $portsInUse = (docker ps --format '{{.Ports}}') -join ' '
          if ($portsInUse -match ':18001->') { $newPort = 18002 }
          $configPath = Join-Path $env:RUNNER_TEMP 'language-detector-nginx.conf'
          $koreanText = [regex]::Unescape('\uC548\uB155\uD558\uC138\uC694 \uBC18\uAC11\uC2B5\uB2C8\uB2E4')
          function Test-ContainerExists([string]$name) { return [bool](docker ps -aq --filter "name=^/${name}$") }
          function Test-Detect([string]$baseUrl) {
              $json = @{ text = $koreanText } | ConvertTo-Json -Compress
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
              return Invoke-RestMethod -Uri "$baseUrl/detect" -Method Post -ContentType 'application/json; charset=utf-8' -Body $bytes -TimeoutSec 10
          }
          docker pull $env:IMAGE
          if ($LASTEXITCODE -ne 0) { throw 'docker pull failed.' }
          $netExists = docker network ls -q --filter "name=^${network}$"
          if (-not $netExists) { docker network create $network | Out-Null }
          if (Test-ContainerExists $new) { docker rm -f $new | Out-Null }
          docker run -d --name $new --network $network -p "${newPort}:8000" $env:IMAGE
          if ($LASTEXITCODE -ne 0) { throw 'Starting the new container failed.' }
          $ready = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                  $health = Invoke-RestMethod -Uri "http://127.0.0.1:${newPort}/health" -TimeoutSec 3
                  if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
          }
          if (-not $ready) { docker logs $new; throw 'New container did not become healthy.' }
          $newIp = docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $new
          @"
          events {}
          http {
              upstream language_detector {
                  server ${newIp}:8000;
              }
              server {
                  listen 8001;
                  location / {
                      proxy_pass http://language_detector;
                      proxy_set_header Host `$host;
                      proxy_set_header X-Real-IP `$remote_addr;
                      proxy_set_header X-Forwarded-For `$proxy_add_x_forwarded_for;
                  }
              }
          }
          "@ | Set-Content -Path $configPath -Encoding ASCII
          if (-not (Test-ContainerExists $proxy)) {
              docker run -d --name $proxy --network $network -p 8001:8001 nginx:1.27-alpine
              if ($LASTEXITCODE -ne 0) { throw 'Starting nginx failed.' }
              Start-Sleep -Seconds 3
          } elseif ((docker inspect -f '{{.State.Running}}' $proxy) -ne 'true') {
              docker start $proxy | Out-Null
              Start-Sleep -Seconds 3
          }
          docker cp $configPath "${proxy}:/etc/nginx/nginx.conf"
          docker exec $proxy nginx -t
          if ($LASTEXITCODE -ne 0) { throw 'nginx config test failed.' }
          docker exec $proxy nginx -s reload
          Start-Sleep -Seconds 2
          $stableHealth = Invoke-RestMethod -Uri 'http://127.0.0.1:8001/health' -TimeoutSec 10
          if ($stableHealth.status -ne 'ok') { throw 'Stable URL is not healthy after switching.' }
          $result = Test-Detect 'http://127.0.0.1:8001'
          if ($result.language -ne 'Korean') { throw "Expected Korean detection, got: $($result.language)" }
          if (Test-ContainerExists $current) { docker rm -f $current | Out-Null }
          docker rename $new $current

      - name: Mark deployment end
        if: always()
        run: Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'language-detector-deployment.end') -Value ([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) -Encoding ASCII

      - name: Stop monitor and write summary
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $stopFile = Join-Path $env:RUNNER_TEMP 'language-detector-monitor.stop'
          $pidFile = Join-Path $env:RUNNER_TEMP 'language-detector-monitor.pid'
          $log = Join-Path $env:RUNNER_TEMP 'language-detector-monitor.csv'
          Set-Content -LiteralPath $stopFile -Value 'stop' -Encoding ASCII
          if (Test-Path -LiteralPath $pidFile) {
              $monitorPid = [int](Get-Content -LiteralPath $pidFile)
              try { Wait-Process -Id $monitorPid -Timeout 45 -ErrorAction Stop } catch { }
          }
          $rows = @()
          if (Test-Path -LiteralPath $log) { $rows = @(Import-Csv -LiteralPath $log) }
          $startPath = Join-Path $env:RUNNER_TEMP 'language-detector-deployment.start'
          $endPath = Join-Path $env:RUNNER_TEMP 'language-detector-deployment.end'
          $start = if (Test-Path -LiteralPath $startPath) { [int64](Get-Content $startPath) } else { [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() }
          $end = if (Test-Path -LiteralPath $endPath) { [int64](Get-Content $endPath) } else { [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() }
          $after = $end + 30000
          $success = @($rows | Where-Object { $_.valid -eq 'True' -and $_.http_status -eq '200' }).Count
          $failure = $rows.Count - $success
          $gaps = @()
          for ($i = 1; $i -lt $rows.Count; $i++) { $gaps += (([int64]$rows[$i].start_ms - [int64]$rows[$i-1].end_ms) / 1000.0) }
          $largestGap = if ($gaps.Count) { [Math]::Round(($gaps | Measure-Object -Maximum).Maximum, 2) } else { 0 }
          function Phase([int64]$t) { if ($t -lt $start) { 'Before' } elseif ($t -le $end) { 'During' } elseif ($t -le $after) { 'After' } else { 'Other' } }
          $summary = @('# Language Detector deployment monitor','',"Stable URL: http://127.0.0.1:8001",("Window: Unix ms {0} to {1}; deployment: {2} to {3}; after: 30 seconds" -f $start,$after,$start,$end),'','| Phase | Requests ok/total | Representative request | HTTP | Version |','|---|---:|---|---:|---|')
          foreach ($phase in @('Before','During','After')) {
              $phaseRows = @($rows | Where-Object { (Phase ([int64]$_.start_ms)) -eq $phase })
              $ok = @($phaseRows | Where-Object { $_.valid -eq 'True' -and $_.http_status -eq '200' }).Count
              $rep = if ($phaseRows.Count) { $phaseRows[0] } else { $null }
              $repText = if ($rep) { "#$($rep.request_number) ($($rep.response_ms) ms)" } else { 'none' }
              $http = if ($rep) { $rep.http_status } else { '-' }
              $version = if ($rep) { $rep.model_version } else { '-' }
              $summary += "| $phase | $ok/$($phaseRows.Count) | $repText | $http | $version |"
          }
          $summary += @('',"Total successes: $success","Total failures: $failure","Largest gap between records: $largestGap seconds")
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summary -join [Environment]::NewLine) -Encoding UTF8

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-detector-deployment-monitor
          path: ${{ runner.temp }}/language-detector-monitor.csv
          if-no-files-found: warn
