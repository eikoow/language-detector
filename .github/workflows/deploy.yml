name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and deploy image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/language-detector:latest
        run: |
          $ErrorActionPreference = 'Stop'
          $network = 'language-detector-net'
          $proxy = 'language-detector-proxy'
          $current = 'language-detector-app'
          $new = 'language-detector-app-new'
          $newPort = 18001
          $configPath = Join-Path $env:RUNNER_TEMP 'language-detector-nginx.conf'

          docker pull $env:IMAGE

          docker network inspect $network *> $null
          if ($LASTEXITCODE -ne 0) {
            docker network create $network
          }

          # A failed previous deployment can leave this candidate behind. The
          # stable app container is never removed until the new one is ready.
          docker rm -f $new 2>$null | Out-Null
          docker run -d --name $new --network $network -p "${newPort}:8000" $env:IMAGE

          $ready = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:${newPort}/health" -TimeoutSec 3
              if ($health.status -eq 'ok') {
                $ready = $true
                break
              }
            } catch {
              # The application trains its model during startup.
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            docker logs $new
            throw 'The new application container did not become healthy.'
          }

          $newIp = docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $new
          @"
          events {}
          http {
              upstream language_detector {
                  server ${newIp}:8000;
              }
              server {
                  listen 8001;
                  location / {
                      proxy_pass http://language_detector;
                      proxy_set_header Host `$host;
                      proxy_set_header X-Real-IP `$remote_addr;
                      proxy_set_header X-Forwarded-For `$proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto `$scheme;
                  }
              }
          }
          "@ | Set-Content -Path $configPath -Encoding ascii

          $proxyExists = docker ps -aq --filter "name=^/${proxy}$"
          if (-not $proxyExists) {
            docker run -d --name $proxy --network $network -p 8001:8001 nginx:1.27-alpine
            Start-Sleep -Seconds 2
          } elseif ((docker inspect -f '{{.State.Running}}' $proxy) -ne 'true') {
            docker start $proxy
            Start-Sleep -Seconds 2
          }

          docker cp $configPath "${proxy}:/etc/nginx/nginx.conf"
          docker exec $proxy nginx -t
          docker exec $proxy nginx -s reload

          $stableHealth = Invoke-RestMethod -Uri 'http://127.0.0.1:8001/health' -TimeoutSec 10
          if ($stableHealth.status -ne 'ok') {
            throw 'The stable URL did not return a healthy response after switching.'
          }

          $payload = @{ text = '안녕하세요 오늘 날씨가 정말 좋습니다.' } | ConvertTo-Json
          $detected = Invoke-RestMethod -Uri 'http://127.0.0.1:8001/detect' -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 10
          if ($detected.language -ne 'Korean') {
            throw "Expected Korean detection, got: $($detected.language)"
          }

          # The proxy is serving the new IP at this point, so the old app can
          # now be removed without interrupting requests.
          docker rm -f $current 2>$null | Out-Null
          docker rename $new $current

      - name: Verify deployed service
        run: |
          $ErrorActionPreference = 'Stop'
          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8001/health' -TimeoutSec 10
          if ($health.status -ne 'ok') { throw 'Health check failed.' }
          $payload = @{ text = '안녕하세요 오늘 날씨가 정말 좋습니다.' } | ConvertTo-Json
          $result = Invoke-RestMethod -Uri 'http://127.0.0.1:8001/detect' -Method Post -ContentType 'application/json' -Body $payload -TimeoutSec 10
          if ($result.language -ne 'Korean') { throw "Expected Korean, got: $($result.language)" }
