name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and deploy image (zero-downtime)
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/language-detector:latest
        run: |
          $ErrorActionPreference = 'Stop'
          $network = 'language-detector-net'
          $proxy = 'language-detector-proxy'
          $current = 'language-detector-app'
          $new = 'language-detector-app-new'
          $newPort = 18001
          $configPath = Join-Path $env:RUNNER_TEMP 'language-detector-nginx.conf'

          # Korean test sentence written as unicode escapes so the file stays ASCII-only.
          $koreanText = [regex]::Unescape('\uC548\uB155\uD558\uC138\uC694 \uBC18\uAC11\uC2B5\uB2C8\uB2E4')

          function Test-Detect([string]$baseUrl) {
            $json = @{ text = $koreanText } | ConvertTo-Json
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
            $r = Invoke-RestMethod -Uri "$baseUrl/detect" -Method Post -ContentType 'application/json; charset=utf-8' -Body $bytes -TimeoutSec 10
            return $r.language
          }

          function Test-ContainerExists([string]$name) {
            $id = docker ps -aq --filter "name=^/${name}$"
            return [bool]$id
          }

          docker pull $env:IMAGE
          if ($LASTEXITCODE -ne 0) { throw 'docker pull failed.' }

          # Create the network only if it does not exist (no stderr redirection,
          # which Windows PowerShell 5.1 turns into a terminating error).
          $netExists = docker network ls -q --filter "name=^${network}$"
          if (-not $netExists) { docker network create $network | Out-Null }

          # A failed previous deployment can leave the candidate behind.
          if (Test-ContainerExists $new) { docker rm -f $new | Out-Null }

          docker run -d --name $new --network $network -p "${newPort}:8000" $env:IMAGE
          if ($LASTEXITCODE -ne 0) { throw 'Starting the new container failed.' }

          $ready = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:${newPort}/health" -TimeoutSec 3
              if ($health.status -eq 'ok') { $ready = $true; break }
            } catch {
              # The application trains its model during startup.
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            docker logs $new
            throw 'The new application container did not become healthy.'
          }

          $newIp = docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $new
          @"
          events {}
          http {
              upstream language_detector {
                  server ${newIp}:8000;
              }
              server {
                  listen 8001;
                  location / {
                      proxy_pass http://language_detector;
                      proxy_set_header Host `$host;
                      proxy_set_header X-Real-IP `$remote_addr;
                      proxy_set_header X-Forwarded-For `$proxy_add_x_forwarded_for;
                  }
              }
          }
          "@ | Set-Content -Path $configPath -Encoding ascii

          if (-not (Test-ContainerExists $proxy)) {
            docker run -d --name $proxy --network $network -p 8001:8001 nginx:1.27-alpine
            if ($LASTEXITCODE -ne 0) { throw 'Starting the nginx proxy failed.' }
            Start-Sleep -Seconds 3
          } elseif ((docker inspect -f '{{.State.Running}}' $proxy) -ne 'true') {
            docker start $proxy | Out-Null
            Start-Sleep -Seconds 3
          }

          docker cp $configPath "${proxy}:/etc/nginx/nginx.conf"
          docker exec $proxy nginx -t
          if ($LASTEXITCODE -ne 0) { throw 'nginx config test failed.' }
          docker exec $proxy nginx -s reload
          Start-Sleep -Seconds 2

          $stableHealth = Invoke-RestMethod -Uri 'http://127.0.0.1:8001/health' -TimeoutSec 10
          if ($stableHealth.status -ne 'ok') { throw 'Stable URL is not healthy after switching.' }
          $lang = Test-Detect 'http://127.0.0.1:8001'
          if ($lang -ne 'Korean') { throw "Expected Korean detection, got: $lang" }

          # The proxy now serves the new container, so the old one can be removed.
          if (Test-ContainerExists $current) { docker rm -f $current | Out-Null }
          docker rename $new $current
          Write-Output "Deployed $env:IMAGE -> http://127.0.0.1:8001 (detected: $lang)"

      - name: Verify deployed service
        run: |
          $ErrorActionPreference = 'Stop'
          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8001/health' -TimeoutSec 10
          if ($health.status -ne 'ok') { throw 'Health check failed.' }
          $koreanText = [regex]::Unescape('\uC548\uB155\uD558\uC138\uC694 \uBC18\uAC11\uC2B5\uB2C8\uB2E4')
          $bytes = [System.Text.Encoding]::UTF8.GetBytes((@{ text = $koreanText } | ConvertTo-Json))
          $result = Invoke-RestMethod -Uri 'http://127.0.0.1:8001/detect' -Method Post -ContentType 'application/json; charset=utf-8' -Body $bytes -TimeoutSec 10
          if ($result.language -ne 'Korean') { throw "Expected Korean, got: $($result.language)" }
          Write-Output "Service OK: health=ok, detect=$($result.language)"